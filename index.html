<body>
<div class="login"><section class="login-brand-panel"><div class="brand-glow"></div><img class="login-crest" src="midori-high-logo.jpg" alt="Logo Midori High"><p class="eyebrow">ÉTABLISSEMENT SCOLAIRE · DEPUIS 1990</p><h1>Midori High</h1><p class="brand-subtitle">Portail administratif</p><div class="brand-rule"><span>✿</span></div><p class="japanese-line">学び、成長し、共に歩む</p><p class="brand-motto">Apprendre, grandir, avancer ensemble.</p><div class="petal petal-one">✿</div><div class="petal petal-two">✿</div><div class="petal petal-three">✿</div></section><section class="login-panel"><div class="login-card"><div class="login-head"><img class="school-logo" src="midori-high-logo.jpg" alt="Midori High" style="width:76px;height:76px;border-radius:18px"><h1>Midori High</h1><p>Portail administratif</p></div><form id="loginForm" class="form"><div class="field full"><label>Adresse e-mail</label><input name="email" type="email" autocomplete="username" required placeholder="Votre e-mail de compte Supabase"></div><div class="field full"><label>Mot de passe</label><input name="password" type="password" autocomplete="current-password" required placeholder="Votre mot de passe"></div><div id="loginError" class="notice error full" style="display:none;min-height:0"></div><div class="field full"><button type="submit" class="btn primary" style="width:100%">Se connecter</button></div><div class="field full" style="text-align:center"><small class="muted">Accès réservé aux membres autorisés de Midori High.</small></div></form><div class="foot">© Midori High · Portail administratif · 1990</div></div></section></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
    "https://esiwwkphbqkqqcfelktn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Gn6HhpZXdeoaWhWJ7wRWLw_D3dXLTnX";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// Vérification utilisateur

async function checkUser() {

    const { data } =
        await supabaseClient.auth.getUser();

    if (!data.user) {

        window.location.href = "index.html";

        return false;
    }

    return true;
}


// Récupérer l'ID dans l'URL

function getStudentId() {

    const params =
        new URLSearchParams(window.location.search);

    return params.get("id");

}


// Échapper le HTML

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// Afficher une erreur

function showError(message) {

    document.getElementById("content").innerHTML = `

        <div class="error">
            ${escapeHTML(message)}
        </div>

    `;

}


// Charger le dossier

async function loadStudent() {

    const connected = await checkUser();

    if (!connected) return;


    const studentId = getStudentId();


    if (!studentId) {

        showError(
            "Aucun élève n'a été sélectionné."
        );

        return;
    }


    const { data: student, error } =
        await supabaseClient
            .from("students")
            .select("*")
            .eq("id", studentId)
            .single();


    if (error) {

        console.error(error);

        showError(
            "Impossible de charger le dossier de cet élève."
        );

        return;
    }


    if (!student) {

        showError(
            "Élève introuvable."
        );

        return;
    }


    displayStudent(student);

}


// Afficher le dossier

function displayStudent(student) {

    const fullName =
        student.full_name || "Élève";

    const initials =
        fullName
            .split(" ")
            .filter(Boolean)
            .slice(0, 2)
            .map(word => word.charAt(0))
            .join("")
            .toUpperCase();


    document.getElementById("content").innerHTML = `

        <div class="profile-header">

            <div class="avatar">
                ${escapeHTML(initials)}
            </div>

            <div class="profile-info">

                <h1>
                    ${escapeHTML(fullName)}
                </h1>

                <p>
                    Dossier scolaire — Midori High
                </p>

            </div>

            <div class="status">
                Élève
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                👤 Informations personnelles
            </div>

            <div class="info-grid">

                <div class="info">

                    <span class="label">
                        Nom complet
                    </span>

                    <span class="value">
                        ${escapeHTML(student.full_name || "—")}
                    </span>

                </div>


                <div class="info">

                    <span class="label">
                        Identifiant
                    </span>

                    <span class="value">
                        ${escapeHTML(student.username || "—")}
                    </span>

                </div>


                <div class="info">

                    <span class="label">
                        Classe
                    </span>

                    <span class="value">
                        ${escapeHTML(student.class_name || "—")}
                    </span>

                </div>


                <div class="info">

                    <span class="label">
                        Date de naissance
                    </span>

                    <span class="value">
                        ${student.birth_date || "—"}
                    </span>

                </div>

            </div>

        </div>


        <div class="section">

            <div class="section-title">
                📋 Scolarité
            </div>

            <div class="empty-section">
                Les informations de scolarité seront disponibles ici.
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                📅 Absences et retards
            </div>

            <div class="empty-section">
                Aucune donnée d'absence ou de retard pour le moment.
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                📝 Notes
            </div>

            <div class="empty-section">
                Les notes de l'élève seront affichées ici.
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                ⚠️ Sanctions et comportement
            </div>

            <div class="empty-section">
                Aucune sanction enregistrée.
            </div>

        </div>

    `;

}


// Lancer

loadStudent();


</script>

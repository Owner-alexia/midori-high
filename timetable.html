<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midori High — Emploi du temps</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f6f8f7;
        color: #26352f;
    }

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 240px;
        height: 100vh;
        background: #ffffff;
        border-right: 1px solid #e5ebe8;
        padding: 25px 15px;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
        color: #466b59;
        text-align: center;
        margin-bottom: 30px;
    }

    .section-title {
        font-size: 12px;
        color: #9aa7a1;
        text-transform: uppercase;
        margin: 20px 10px 8px;
    }

    .nav-item {
        display: block;
        text-decoration: none;
        color: #53615b;
        padding: 11px 13px;
        border-radius: 9px;
        margin-bottom: 4px;
        font-size: 14px;
    }

    .nav-item:hover {
        background: #eef4f1;
    }

    .nav-item.active {
        background: #e5efe9;
        color: #315744;
        font-weight: bold;
    }

    .main {
        margin-left: 240px;
        padding: 30px;
    }

    .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .top h1 {
        font-size: 28px;
        color: #30473c;
    }

    .top p {
        color: #84918b;
        margin-top: 5px;
    }

    .add-btn {
        border: none;
        background: #4f7864;
        color: white;
        padding: 12px 18px;
        border-radius: 9px;
        cursor: pointer;
        font-weight: bold;
    }

    .add-btn:hover {
        background: #3f6452;
    }

    .toolbar {
        background: white;
        padding: 18px;
        border-radius: 14px;
        border: 1px solid #e5ebe8;
        margin-bottom: 20px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
        padding: 11px 12px;
        border: 1px solid #dce5e0;
        border-radius: 8px;
        outline: none;
        background: white;
    }

    .toolbar input {
        flex: 1;
        min-width: 220px;
    }

    .days {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .day-btn {
        border: 1px solid #dce5e0;
        background: white;
        padding: 10px 17px;
        border-radius: 9px;
        cursor: pointer;
        color: #52615a;
    }

    .day-btn:hover {
        background: #eef4f1;
    }

    .day-btn.active {
        background: #4f7864;
        color: white;
        border-color: #4f7864;
        font-weight: bold;
    }

    .courses {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 15px;
    }

    .course {
        background: white;
        border: 1px solid #e4ebe7;
        border-radius: 14px;
        padding: 18px;
        position: relative;
    }

    .course-time {
        color: #4f7864;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .course-subject {
        font-size: 17px;
        font-weight: bold;
        color: #30473c;
        margin-bottom: 7px;
    }

    .course-info {
        color: #78857f;
        font-size: 14px;
        line-height: 1.7;
    }

    .course-actions {
        display: flex;
        gap: 8px;
        margin-top: 15px;
    }

    .edit-btn,
    .delete-btn {
        border: none;
        padding: 8px 12px;
        border-radius: 7px;
        cursor: pointer;
    }

    .edit-btn {
        background: #edf3f0;
        color: #416452;
    }

    .delete-btn {
        background: #faeeee;
        color: #b24f4f;
    }

    .empty {
        background: white;
        border: 1px solid #e5ebe8;
        border-radius: 14px;
        padding: 45px;
        text-align: center;
        color: #8a9690;
    }

    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 30, 25, 0.45);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
    }

    .modal-content {
        background: white;
        width: 100%;
        max-width: 520px;
        border-radius: 16px;
        padding: 25px;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-header h2 {
        color: #30473c;
    }

    .close {
        border: none;
        background: none;
        font-size: 25px;
        cursor: pointer;
        color: #84918b;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        color: #53615b;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #dce5e0;
        border-radius: 8px;
        outline: none;
        background: white;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .save-btn {
        width: 100%;
        border: none;
        background: #4f7864;
        color: white;
        padding: 12px;
        border-radius: 9px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 5px;
    }

    .save-btn:hover {
        background: #3f6452;
    }

    @media (max-width: 800px) {
        .sidebar {
            width: 190px;
        }

        .main {
            margin-left: 190px;
        }
    }
</style>
</head>

<body>
<aside class="sidebar">

    <div class="logo">
        🌿 Midori High
        <div style="font-size:12px; opacity:.65; margin-top:4px;">Portail Administratif</div>
    </div>

    <div class="section-title">Administration</div>

        <a href="dashboard.html" class="nav-item">
            📊 Tableau de bord
        </a>

        <a href="students.html" class="nav-item">
            👨‍🎓 Élèves
        </a>

        <a href="professors.html" class="nav-item">
            👨‍🏫 Professeurs
        </a>

        <a href="classes.html" class="nav-item">
            🏫 Classes
        </a>

    <div class="section-title">Scolarité</div>

        <a href="subjects.html" class="nav-item">
            📚 Matières
        </a>

        <a href="timetable.html" class="nav-item active">
            🕐 Emploi du temps
        </a>

        <a href="attendance.html" class="nav-item">
            📋 Fiches d'appel
        </a>

        <a href="absences.html" class="nav-item">
            ❌ Absences
        </a>

        <a href="points.html" class="nav-item">
            ⭐ Points
        </a>

</aside>

<main class="main">

    <div class="top">
        <div>
            <h1>🕐 Emploi du temps</h1>
            <p>Gérez les cours et les horaires des classes.</p>
        </div>

        <button class="add-btn" onclick="openAddModal()">
            + Ajouter un cours
        </button>
    </div>

    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher une classe, matière ou professeur..."
            oninput="renderCourses()"
        >

        <select id="classFilter" onchange="renderCourses()">
            <option value="">Toutes les classes</option>
        </select>

    </div>

    <div class="days">

        <button class="day-btn active" data-day="1" onclick="selectDay(1)">
            Lundi
        </button>

        <button class="day-btn" data-day="2" onclick="selectDay(2)">
            Mardi
        </button>

        <button class="day-btn" data-day="3" onclick="selectDay(3)">
            Mercredi
        </button>

        <button class="day-btn" data-day="4" onclick="selectDay(4)">
            Jeudi
        </button>

        <button class="day-btn" data-day="5" onclick="selectDay(5)">
            Vendredi
        </button>

        <button class="day-btn" data-day="6" onclick="selectDay(6)">
            Samedi
        </button>

        <button class="day-btn" data-day="7" onclick="selectDay(7)">
            Dimanche
        </button>

    </div>

    <div id="courses" class="courses">
        <div class="empty">
            Chargement...
        </div>
    </div>

</main>


<!-- MODAL -->

<div class="modal" id="courseModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Ajouter un cours
            </h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <form id="courseForm">

            <input type="hidden" id="courseId">

            <div class="form-group">

                <label>Classe</label>

                <select id="classId" required>
                    <option value="">Sélectionner une classe</option>
                </select>

            </div>

            <div class="form-group">

                <label>Professeur</label>

                <select id="professorId" required>
                    <option value="">Sélectionner un professeur</option>
                </select>

            </div>

            <div class="form-group">

                <label>Matière</label>

                <select id="subjectId" required>
                    <option value="">Sélectionner une matière</option>
                </select>

            </div>

            <div class="form-group">

                <label>Jour</label>

                <select id="dayOfWeek" required>

                    <option value="1">Lundi</option>
                    <option value="2">Mardi</option>
                    <option value="3">Mercredi</option>
                    <option value="4">Jeudi</option>
                    <option value="5">Vendredi</option>
                    <option value="6">Samedi</option>
                    <option value="7">Dimanche</option>

                </select>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Heure de début</label>

                    <input
                        type="time"
                        id="startTime"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Heure de fin</label>

                    <input
                        type="time"
                        id="endTime"
                        required
                    >

                </div>

            </div>

            <div class="form-group">

                <label>Salle</label>

                <input
                    type="text"
                    id="room"
                    placeholder="Ex : Salle 204"
                >

            </div>

            <button type="submit" class="save-btn">
                Enregistrer
            </button>

        </form>

    </div>

</div>
<script>

const SUPABASE_URL =
    "https://esiwwkphbqkqqcfelktn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Gn6H6hpZXdeoaWhW7jRWLw_D3dXLTnX";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let courses = [];
let classes = [];
let professors = [];
let subjects = [];

let selectedDay = 1;


// AUTH

async function checkUser() {

    const { data } =
        await supabaseClient.auth.getUser();

    if (!data.user) {

        window.location.href =
            "index.html";

        return false;
    }

    return true;
}


// LOAD CLASSES

async function loadClasses() {

    const { data, error } =
        await supabaseClient
            .from("classes")
            .select("*")
            .order("name");

    if (error) {

        console.error(
            "Erreur classes :",
            error
        );

        return;
    }

    classes = data || [];

    const classSelect =
        document.getElementById("classId");

    const classFilter =
        document.getElementById("classFilter");

    classes.forEach(cls => {

        const option =
            document.createElement("option");

        option.value = cls.id;
        option.textContent = cls.name;

        classSelect.appendChild(option);

        const filterOption =
            document.createElement("option");

        filterOption.value = cls.id;
        filterOption.textContent = cls.name;

        classFilter.appendChild(
            filterOption
        );

    });
}


// LOAD PROFESSORS

async function loadProfessors() {

    const { data, error } =
        await supabaseClient
            .from("professors")
            .select("*")
            .order("full_name");

    if (error) {

        console.error(
            "Erreur professeurs :",
            error
        );

        return;
    }

    professors = data || [];

    const select =
        document.getElementById(
            "professorId"
        );

    professors.forEach(professor => {

        const option =
            document.createElement("option");

        option.value = professor.id;
        option.textContent =
            professor.full_name;

        select.appendChild(option);

    });
}


// LOAD SUBJECTS

async function loadSubjects() {

    const { data, error } =
        await supabaseClient
            .from("subjects")
            .select("*")
            .order("name");

    if (error) {

        console.error(
            "Erreur matières :",
            error
        );

        return;
    }

    subjects = data || [];

    const select =
        document.getElementById(
            "subjectId"
        );

    subjects.forEach(subject => {

        const option =
            document.createElement("option");

        option.value = subject.id;
        option.textContent =
            subject.name;

        select.appendChild(option);

    });
}


// LOAD COURSES

async function loadCourses() {

    const { data, error } =
        await supabaseClient
            .from("timetable")
            .select(`
                id,
                class_id,
                professor_id,
                subject_id,
                day_of_week,
                start_time,
                end_time,
                room,
                classes (
                    name
                ),
                professors (
                    full_name
                ),
                subjects (
                    name
                )
            `)
            .order("start_time");

    if (error) {

        console.error(
            "Erreur emploi du temps :",
            error
        );

        document.getElementById(
            "courses"
        ).innerHTML = `
            <div class="empty">
                Impossible de charger l'emploi du temps.
            </div>
        `;

        return;
    }

    courses = data || [];

    renderCourses();
}


// RENDER

function renderCourses() {

    const container =
        document.getElementById(
            "courses"
        );

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();

    const classFilter =
        document.getElementById(
            "classFilter"
        ).value;

    let filtered =
        courses.filter(course => {

            if (
                Number(course.day_of_week)
                !== Number(selectedDay)
            ) {
                return false;
            }

            if (
                classFilter &&
                course.class_id !== classFilter
            ) {
                return false;
            }

            const className =
                course.classes?.name || "";

            const professorName =
                course.professors?.full_name || "";

            const subjectName =
                course.subjects?.name || "";

            const text =
                (
                    className +
                    " " +
                    professorName +
                    " " +
                    subjectName
                ).toLowerCase();

            return text.includes(search);

        });


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Aucun cours prévu pour ce jour.
            </div>
        `;

        return;
    }


    container.innerHTML =
        filtered.map(course => {

            const className =
                course.classes?.name
                || "Classe inconnue";

            const professorName =
                course.professors?.full_name
                || "Professeur inconnu";

            const subjectName =
                course.subjects?.name
                || "Matière inconnue";

            const start =
                course.start_time
                    ? course.start_time.slice(0, 5)
                    : "";

            const end =
                course.end_time
                    ? course.end_time.slice(0, 5)
                    : "";

            return `

                <div class="course">

                    <div class="course-time">
                        ${start} — ${end}
                    </div>

                    <div class="course-subject">
                        📚 ${subjectName}
                    </div>

                    <div class="course-info">

                        🏫 Classe :
                        <strong>${className}</strong>
                        <br>

                        👩‍🏫 Professeur :
                        ${professorName}
                        <br>

                        🚪 Salle :
                        ${course.room || "Non renseignée"}

                    </div>

                    <div class="course-actions">

                        <button
                            class="edit-btn"
                            onclick="editCourse('${course.id}')"
                        >
                            ✏️ Modifier
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteCourse('${course.id}')"
                        >
                            🗑️ Supprimer
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


// DAY

function selectDay(day) {

    selectedDay = day;

    document
        .querySelectorAll(".day-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(
                    button.dataset.day
                ) === Number(day)
            );

        });

    renderCourses();
}


// OPEN ADD

function openAddModal() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Ajouter un cours";

    document.getElementById(
        "courseForm"
    ).reset();

    document.getElementById(
        "courseId"
    ).value = "";

    document.getElementById(
        "dayOfWeek"
    ).value =
        selectedDay;

    document.getElementById(
        "courseModal"
    ).style.display =
        "flex";
}


// CLOSE

function closeModal() {

    document.getElementById(
        "courseModal"
    ).style.display =
        "none";
}


// EDIT

function editCourse(id) {

    const course =
        courses.find(
            item => item.id === id
        );

    if (!course) return;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Modifier le cours";

    document.getElementById(
        "courseId"
    ).value =
        course.id;

    document.getElementById(
        "classId"
    ).value =
        course.class_id;

    document.getElementById(
        "professorId"
    ).value =
        course.professor_id;

    document.getElementById(
        "subjectId"
    ).value =
        course.subject_id;

    document.getElementById(
        "dayOfWeek"
    ).value =
        course.day_of_week;

    document.getElementById(
        "startTime"
    ).value =
        course.start_time?.slice(0, 5);

    document.getElementById(
        "endTime"
    ).value =
        course.end_time?.slice(0, 5);

    document.getElementById(
        "room"
    ).value =
        course.room || "";

    document.getElementById(
        "courseModal"
    ).style.display =
        "flex";
}


// SAVE

document
    .getElementById("courseForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const id =
                document.getElementById(
                    "courseId"
                ).value;

            const classId =
                document.getElementById(
                    "classId"
                ).value;

            const professorId =
                document.getElementById(
                    "professorId"
                ).value;

            const subjectId =
                document.getElementById(
                    "subjectId"
                ).value;

            const dayOfWeek =
                Number(
                    document.getElementById(
                        "dayOfWeek"
                    ).value
                );

            const startTime =
                document.getElementById(
                    "startTime"
                ).value;

            const endTime =
                document.getElementById(
                    "endTime"
                ).value;

            const room =
                document.getElementById(
                    "room"
                ).value.trim();


            if (
                !classId ||
                !professorId ||
                !subjectId ||
                !startTime ||
                !endTime
            ) {

                alert(
                    "Veuillez remplir tous les champs obligatoires."
                );

                return;
            }


            if (startTime >= endTime) {

                alert(
                    "L'heure de fin doit être après l'heure de début."
                );

                return;
            }


            const courseData = {

                class_id: classId,

                professor_id:
                    professorId,

                subject_id:
                    subjectId,

                day_of_week:
                    dayOfWeek,

                start_time:
                    startTime,

                end_time:
                    endTime,

                room:
                    room || null

            };


            let error;


            if (id) {

                const result =
                    await supabaseClient
                        .from("timetable")
                        .update(courseData)
                        .eq("id", id);

                error = result.error;

            } else {

                const result =
                    await supabaseClient
                        .from("timetable")
                        .insert(
                            courseData
                        );

                error = result.error;

            }


            if (error) {

                console.error(
                    "Erreur sauvegarde :",
                    error
                );

                alert(
                    "Erreur lors de l'enregistrement."
                );

                return;
            }


            closeModal();

            await loadCourses();

        }
    );


// DELETE

async function deleteCourse(id) {

    const confirmed =
        confirm(
            "Voulez-vous vraiment supprimer ce cours ?"
        );

    if (!confirmed) return;


    const { error } =
        await supabaseClient
            .from("timetable")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(
            "Erreur suppression :",
            error
        );

        alert(
            "Impossible de supprimer le cours."
        );

        return;
    }


    await loadCourses();

}


// CLICK OUTSIDE MODAL

window.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "courseModal"
            );

        if (event.target === modal) {
            closeModal();
        }

    }
);


// INITIALISATION

async function init() {

    const authenticated =
        await checkUser();

    if (!authenticated) return;

    await Promise.all([
        loadClasses(),
        loadProfessors(),
        loadSubjects()
    ]);

    await loadCourses();

}

init();

</script>

</body>
</html>
